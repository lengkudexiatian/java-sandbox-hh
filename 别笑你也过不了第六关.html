<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Java Master 积木</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
input,textarea,select{-webkit-user-select:text!important;user-select:text!important}
html,body{height:100%;overflow:hidden;width:100%}
body{display:flex;flex-direction:column;background:#e8ecf1;color:#2c3e50;overflow-x:hidden}
.tb{background:#1e2a3a;color:#fff;padding:8px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:20;min-width:0}
.tb .logo{font-size:14px;font-weight:800;background:linear-gradient(135deg,#f1c40f,#e67e22);padding:3px 12px;border-radius:20px;color:#1e2a3a;white-space:nowrap;flex-shrink:0}
.tb .spacer{flex:1;min-width:0}
.tb .badge{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:20px;font-size:11px;color:#bdc3c7;white-space:nowrap;flex-shrink:0}
.tb button{border:none;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;color:#fff;transition:.15s;white-space:nowrap;flex-shrink:0}
.tb button:active{transform:scale(.95)}
.b-green{background:#27ae60}.b-purple{background:#8e44ad}.b-orange{background:#d35400}
.b-gray{background:#7f8c8d}.b-blue{background:#3498db}.b-red{background:#e74c3c}
.b-pink{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.b-red.confirm{animation:blink .7s infinite}
@keyframes blink{50%{opacity:.5}}
.main{flex:1;display:flex;overflow:hidden;min-height:0;min-width:0}
.left{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.right{width:42%;min-width:280px;display:flex;flex-direction:column;background:#f8f9fa;border-left:2px solid #dce2ea;min-height:0}
@media(max-width:820px){.main{flex-direction:column}.left{flex:1;min-height:0}.right{width:100%;min-height:240px;border-left:none;border-top:2px solid #dce2ea}}
.panel{background:#fff;height:45%;display:flex;flex-direction:column;border-bottom:2px solid #dce2ea;flex-shrink:0;min-height:0}
@media(max-width:820px){.panel{height:40%}}
.search-bar{padding:6px 8px;background:#f7f9fc;border-bottom:1px solid #dce2ea;display:flex;gap:6px;align-items:center;flex-shrink:0;min-width:0}
.search-bar input{flex:1;min-width:0;width:100%;padding:7px 12px;border:2px solid #dce2ea;border-radius:20px;font-size:12px;outline:none;font-family:inherit;background:#fff;color:#2c3e50;overflow:hidden;text-overflow:ellipsis}
.search-bar input:focus{border-color:#3498db;box-shadow:0 0 0 3px rgba(52,152,219,.12)}
.search-bar .clear-search{background:#e0e6ed;border:none;width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:800;color:#7f8c8d;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.search-bar .clear-search.show{display:flex}
.search-info{padding:4px 10px;font-size:11px;color:#5a6a7a;background:#e8f4f8;border-bottom:1px solid #dce2ea;display:none;word-break:break-word;line-height:1.4}
.search-info.show{display:block}
.search-info b{color:#3498db}
.cats{display:flex;flex-wrap:wrap;background:#f7f9fc;border-bottom:1px solid #dce2ea;padding:2px;max-height:76px;overflow-y:auto;overflow-x:hidden;flex-shrink:0}
.cat{flex:0 0 auto;max-width:92px;padding:6px 8px;font-size:10px;font-weight:700;text-align:center;color:#5a6a7a;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.active{color:#1e2a3a;border-bottom-color:#3498db;background:#fff}
.blist{flex:1;padding:8px;overflow-y:auto;overflow-x:hidden;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-height:0;min-width:0}
.bitem{padding:6px 10px;border-radius:14px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:#3498db;transition:.15s;box-shadow:0 2px 5px rgba(0,0,0,.08);max-width:100%;min-width:0;overflow:hidden;white-space:nowrap}
.bitem:active{transform:scale(.95)}
.bitem>span:first-child{flex-shrink:0;font-size:12px;line-height:1}
.bitem>span:not(:first-child){overflow:hidden;text-overflow:ellipsis;min-width:0}
.bitem mark{background:#ffe680;color:#2c3e50;border-radius:2px;padding:0 2px}
.ws{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;background:#fafbfc;background-image:radial-gradient(circle,#d0d8e0 1px,transparent 1px);background-size:22px 22px;min-height:0}
.dz{display:flex;flex-direction:column;gap:4px;min-height:100%;padding-bottom:40px;min-width:0}
.eh{color:#aab4c0;text-align:center;margin:50px 10px;font-size:13px;line-height:1.8}
.eh .big{font-size:40px;display:block;margin-bottom:8px}
.bi{padding:8px 10px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;background:#3498db;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);max-width:100%;min-width:0;touch-action:pan-y;transition:opacity .15s;cursor:grab;overflow:hidden}
.bi:active{cursor:grabbing}
.bi.dragging{opacity:.25}
.bi .dh{flex-shrink:0;font-size:13px;letter-spacing:-2px;opacity:.55;line-height:1}
.bi .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bi .acts{display:flex;gap:3px;flex-shrink:0}
.bi .acts button{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.22);border:none;color:#fff;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.bi.indent-1{margin-left:18px}.bi.indent-2{margin-left:36px}.bi.indent-3{margin-left:54px}.bi.indent-4{margin-left:72px}
.bi.ctrl{border-left:4px solid #f1c40f}
.bi.end{border-left:4px solid #e74c3c;border-left-style:dashed}
.dghost{position:fixed!important;pointer-events:none!important;opacity:.9!important;z-index:99999;box-shadow:0 8px 24px rgba(0,0,0,.35)!important;transform:scale(1.03);margin:0!important;max-width:280px;overflow:hidden}
.dline{position:fixed;height:3px;background:#27ae60;border-radius:2px;z-index:99998;pointer-events:none;display:none;box-shadow:0 0 6px rgba(39,174,96,.7)}
.rp{display:flex;flex-direction:column;flex:1;min-height:0;border-bottom:1px solid #dce2ea;min-width:0}
.rp:last-child{border-bottom:none}
.rh{background:#f7f9fc;padding:6px 12px;font-size:11px;font-weight:700;color:#2c3e50;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid #dce2ea;gap:6px;min-width:0}
.rh button{background:transparent;border:1px solid #b0bec5;border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;color:#2c3e50;white-space:nowrap;flex-shrink:0}
.code-out{flex:1;background:#1e2a3a;color:#d4d4d4;font-family:'Courier New',Consolas,monospace;font-size:11px;padding:8px;overflow:auto;white-space:pre;line-height:1.5;min-height:0}
.run-out{flex:1;background:#fff;padding:8px;overflow:auto;font-family:'Courier New',monospace;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;min-height:0}
.run-out .line{padding:2px 0;border-bottom:1px solid #f5f5f5}
.run-out .line.ok{color:#27ae60}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}
.mo.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mh{background:#1e2a3a;color:#fff;padding:12px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.mh>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh .close{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:50%;font-size:14px;cursor:pointer;line-height:1;flex-shrink:0}
.mb{padding:14px 16px;overflow:auto;flex:1;min-height:0}
.mb .hint{background:#e8f4f8;border-left:3px solid #3498db;padding:8px 10px;font-size:12px;color:#2c3e50;border-radius:5px;margin-bottom:10px;line-height:1.6;word-break:break-word}
.mb label{display:block;font-size:12px;font-weight:700;color:#2c3e50;margin:8px 0 4px;word-break:break-word}
.mb input{display:block;width:100%;min-width:0;padding:9px 11px;border:2px solid #dce2ea;border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:#fff;color:#2c3e50;overflow:hidden;text-overflow:ellipsis}
.mb input:focus{border-color:#3498db}
.mb textarea{display:block;width:100%;min-width:0;height:300px;max-height:50vh;padding:10px;border:2px solid #dce2ea;border-radius:8px;font-family:'Courier New',monospace;font-size:11px;line-height:1.5;background:#1e2a3a;color:#d4d4d4;resize:vertical;overflow:auto;white-space:pre}
.mf{padding:10px 16px;background:#f7f9fc;border-top:1px solid #dce2ea;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap}
.mf button{border:none;padding:9px 18px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-p{background:#27ae60;color:#fff}.btn-s{background:#95a5a6;color:#fff}.btn-i{background:#3498db;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:10px 22px;border-radius:22px;font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;pointer-events:none;z-index:99999;max-width:88vw;text-align:center;word-break:break-word}
.toast.show{opacity:1;bottom:34px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:#f7f9fc;border:2px solid #dce2ea;border-radius:12px;padding:12px;cursor:pointer;transition:.15s;text-align:left;position:relative;min-width:0;overflow:hidden}
.card:hover{border-color:#3498db;background:#e8f4f8;transform:translateY(-1px)}
.card .card-name{font-size:13px;font-weight:800;color:#1e2a3a;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:44px}
.card .card-desc{font-size:11px;color:#7f8c8d;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.card .card-count{font-size:10px;color:#3498db;margin-top:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .card-acts{display:flex;gap:4px;position:absolute;top:6px;right:6px;opacity:0;transition:.15s}
.card:hover .card-acts{opacity:1}
.card .card-acts button{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0}
.card .card-acts .ca-edit{background:#3498db;color:#fff}
.card .card-acts .ca-del{background:#e74c3c;color:#fff}
.section-title{font-size:12px;font-weight:800;color:#1e2a3a;margin:12px 0 8px;padding-bottom:4px;border-bottom:2px solid #3498db;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.section-title>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section-title .count{font-size:10px;color:#7f8c8d;font-weight:600}
.section-title .save-cur{background:#27ae60;color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.empty-user{font-size:12px;color:#aab4c0;text-align:center;padding:16px;background:#f7f9fc;border:2px dashed #dce2ea;border-radius:8px;margin-bottom:8px;line-height:1.6;word-break:break-word}
.cus-item{background:#f7f9fc;border:2px solid #dce2ea;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;min-width:0}
.cus-item .ci-info{flex:1;min-width:0;overflow:hidden}
.cus-item .ci-name{font-size:13px;font-weight:800;color:#1e2a3a;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cus-item .ci-code{font-size:10px;color:#7f8c8d;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;padding:3px 6px;border-radius:4px}
.cus-item .ci-params{font-size:10px;color:#3498db;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cus-item .ci-acts{display:flex;gap:4px;flex-shrink:0}
.cus-item .ci-acts button{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.cus-item .ci-edit{background:#3498db;color:#fff}
.cus-item .ci-del{background:#e74c3c;color:#fff}
.cus-form{background:#f7f9fc;border:2px solid #3498db;border-radius:10px;padding:12px;margin-bottom:10px;min-width:0}
.cus-form label{display:block;font-size:11px;font-weight:700;color:#2c3e50;margin:6px 0 4px;word-break:break-word}
.cus-form input,.cus-form textarea{display:block;width:100%;min-width:0;padding:8px 10px;border:2px solid #dce2ea;border-radius:6px;font-size:12px;outline:none;font-family:inherit;color:#2c3e50;background:#fff;overflow:hidden;text-overflow:ellipsis}
.cus-form textarea{font-family:'Courier New',monospace;height:120px;resize:vertical;white-space:pre;overflow:auto}
.cus-form input:focus,.cus-form textarea:focus{border-color:#3498db}
.cus-form .param-tip{font-size:10px;color:#3498db;margin-top:4px;font-family:monospace;background:#e8f4f8;padding:4px 8px;border-radius:4px;word-break:break-word;overflow:hidden}
.cus-btn{background:#27ae60;color:#fff;border:none;padding:8px 16px;border-radius:18px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;white-space:nowrap}
.cus-btn.cancel{background:#95a5a6}

/* ===== 运行结果 / 画布 ===== */
.cv-wrap{flex:1;min-height:0;position:relative;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cv-wrap canvas{display:block;background:#fff}
.cv-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c3ccd6;font-size:11px;gap:6px;pointer-events:none;text-align:center;padding:10px;line-height:1.6}
.cv-empty .big{font-size:28px}
.rh .rh-acts{display:flex;gap:5px;align-items:center;flex-shrink:0}
.rp.fullscreen{position:fixed!important;inset:12px;z-index:9998;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
.run-out .line.err{color:#e74c3c;background:#fdf0ef;border-radius:4px;padding:4px 6px}
.run-out .line.head{color:#3498db;font-weight:700}

/* ============================================================
   【前端设计器】
   ============================================================ */
#moDesigner{padding:0;background:rgba(15,23,42,.85)}
.dz-shell{width:100%;height:100%;display:flex;flex-direction:column;background:#eef2f7}
.dz-top{background:#1e2a3a;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.3);z-index:5;flex-wrap:wrap}
.dz-title{font-size:14px;font-weight:800}
.dz-top-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.dzb{border:none;border-radius:18px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;transition:.15s;white-space:nowrap}
.dzb:active{transform:scale(.96)}
.dzb-g{background:#27ae60}.dzb-b{background:#3498db}.dzb-s{background:#7f8c8d}
.dzb-x{background:#e74c3c;padding:7px 13px}.dzb-p{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
.dzb-t{background:#16a085}
.dz-body{flex:1;display:flex;min-height:0;min-width:0}
.dz-left{width:172px;background:#fff;border-right:1px solid #dce2ea;overflow-y:auto;flex-shrink:0;padding:8px}
.dz-panel-title{font-size:10.5px;font-weight:800;color:#7f8c8d;margin:8px 2px 6px;letter-spacing:.5px}
.dz-palette{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dz-item{background:#f7f9fc;border:1.5px solid #dce2ea;border-radius:9px;padding:8px 3px;text-align:center;cursor:pointer;transition:.15s;font-size:10px;font-weight:700;color:#2c3e50}
.dz-item:hover{border-color:#3498db;background:#e8f4f8;transform:translateY(-1px)}
.dz-item .ic{display:block;font-size:17px;margin-bottom:2px;line-height:1}
.dz-templates{display:flex;flex-direction:column;gap:4px}
.dz-tpl{background:#f7f9fc;border:1.5px solid #dce2ea;border-radius:8px;padding:7px 8px;font-size:10.5px;font-weight:700;cursor:pointer;color:#2c3e50;text-align:left;transition:.15s}
.dz-tpl:hover{border-color:#8e44ad;background:#f3e8ff}
.dz-center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.dz-canvas-bar{background:#fff;border-bottom:1px solid #dce2ea;padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:11px;color:#5a6a7a;flex-shrink:0;min-width:0}
.dz-canvas-bar .dz-hint{margin-left:auto;color:#aab4c0;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dz-wrap{flex:1;overflow:auto;background:#e8ecf1;background-image:radial-gradient(circle,#ccd5e0 1px,transparent 1px);background-size:18px 18px;display:flex;align-items:center;justify-content:center;padding:22px;min-height:0}
.dz-holder{position:relative;flex-shrink:0}
.dz-stage{position:absolute;left:0;top:0;transform-origin:top left;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.2);border-radius:2px}
.de-el{position:absolute;display:flex;align-items:center;justify-content:center;cursor:move;overflow:hidden;padding:0 10px;line-height:1.35;word-break:break-word;text-align:center}
.de-el.sel{outline:2px solid #3498db;outline-offset:0}
.de-el.sel::after{content:'';position:absolute;inset:0;border:1px dashed rgba(255,255,255,.55);pointer-events:none}
.de-el[contenteditable="true"]{cursor:text;outline:2px solid #27ae60}
.de-inner{pointer-events:none;width:100%;overflow:hidden;text-overflow:ellipsis}
.de-handle{position:absolute;right:-6px;bottom:-6px;width:13px;height:13px;background:#3498db;border:2.5px solid #fff;border-radius:50%;cursor:nwse-resize;z-index:3;display:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.de-el.sel .de-handle{display:block}
.dz-right{width:236px;background:#fff;border-left:1px solid #dce2ea;display:flex;flex-direction:column;flex-shrink:0;min-height:0}
.dz-tabs{display:flex;border-bottom:1px solid #dce2ea;flex-shrink:0}
.dz-tab{flex:1;background:#f7f9fc;border:none;padding:9px 4px;font-size:11.5px;font-weight:700;color:#7f8c8d;cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s}
.dz-tab.active{color:#1e2a3a;background:#fff;border-bottom-color:#3498db}
.dz-tabpane{flex:1;overflow-y:auto;padding:10px;min-height:0}
.di-empty{text-align:center;color:#aab4c0;font-size:12px;padding:44px 10px;line-height:1.8}
.di-head{font-size:12px;font-weight:800;color:#1e2a3a;background:#e8f4f8;padding:8px 10px;border-radius:8px;margin-bottom:10px}
.di-sec{margin-bottom:13px}
.di-sec-t{font-size:10px;font-weight:800;color:#7f8c8d;letter-spacing:.6px;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid #eef2f7}
.di-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;min-width:0}
.di-row>label{flex:0 0 60px;font-size:11px;font-weight:700;color:#5a6a7a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di-row input[type=text],.di-row input[type=number]{flex:1;min-width:0;padding:6px 8px;border:1.5px solid #dce2ea;border-radius:7px;font-size:11.5px;font-family:inherit;outline:none;color:#2c3e50;background:#fff}
.di-row input[type=text]:focus,.di-row input[type=number]:focus{border-color:#3498db}
.di-row select{flex:1;min-width:0;padding:6px 8px;border:1.5px solid #dce2ea;border-radius:7px;font-size:11.5px;font-family:inherit;outline:none;background:#fff;color:#2c3e50}
.di-row input[type=range]{flex:1;min-width:0;accent-color:#3498db;height:18px}
.di-row .di-val{flex:0 0 32px;text-align:right;font-size:10.5px;color:#7f8c8d;font-family:monospace}
.di-grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.di-grid2 .di-row{margin:0}
.di-grid2 .di-row>label{flex:0 0 24px}

<script>
'use strict';
var B = [];
function D(id,cat,icon,label,inputs,template,labelTpl){
  var inp = (inputs||[]).map(function(x){ return {k:x[0], l:x[1], d:x[2]}; });
  B.push({
    id: id, cat: cat, icon: icon, label: label, inputs: inp,
    genJava: function(v){
      var s = template, ks = Object.keys(v||{});
      for (var i=0;i<ks.length;i++){ var k = ks[i]; s = s.split('{'+k+'}').join(v[k] === undefined ? '' : v[k]); }
      return s;
    },
    labelFn: function(v){
      var s = labelTpl || (icon+' '+label), ks = Object.keys(v||{});
      for (var i=0;i<ks.length;i++){ var k = ks[i]; s = s.split('{'+k+'}').join(v[k] === undefined ? k : v[k]); }
      return s;
    }
  });
}
</script>

/* ---------- 通用：下载文件 ---------- */
function downloadFile(filename, content, mime){
  try {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    return true;
  } catch(e){ toast('❌ 下载失败：' + e.message); return false; }
}
window.downloadFile = downloadFile;

/* ---------- 通用：选择文件（文本） ---------- */
function pickFile(accept, cb){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept || '';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){ cb(r.result, f); };
    r.onerror = function(){ toast('❌ 读取文件失败'); };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- 通用：选择图片 ---------- */
function pickImage(cb){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024){
      toast('⚠️ 图片较大（' + (f.size/1024/1024).toFixed(1) + 'MB），可能影响性能');
    }
    var r = new FileReader();
    r.onload = function(){ cb(r.result, f); };
    r.onerror = function(){ toast('❌ 读取图片失败'); };
    r.readAsDataURL(f);
  };
  inp.click();
}
window.pickImage = pickImage;
window.pickFile = pickFile;

function fuzzySearch(query){
  var q = String(query||'').trim().toLowerCase();
  if (!q) return [];
  var terms = {};
  terms[q] = 1;
  Object.keys(SYN).forEach(function(k){
    if (k.indexOf(q) >= 0 || q.indexOf(k) >= 0) SYN[k].forEach(function(s){ terms[s] = 1; });
  });
  Object.keys(SYN).forEach(function(k){
    var ss = SYN[k];
    for (var i=0;i<ss.length;i++){ if (ss[i] === q || ss[i].indexOf(q) >= 0){ terms[k] = 1; ss.forEach(function(s){ terms[s] = 1; }); break; } }
  });
  var res = [];
  B.forEach(function(b){
    var best = 0;
    var flds = [{t:b.label,w:1}, {t:b.id,w:0.85}, {t:b.cat,w:0.7}];
    (b.inputs||[]).forEach(function(f){ flds.push({t:f.l||'', w:0.5}); });
    Object.keys(terms).forEach(function(term){
      flds.forEach(function(f){
        var s = score(f.t, term) * f.w;
        if (s > best) best = s;
      });
    });
    if (best > 0) res.push({block:b, score:best});
  });
  res.sort(function(a,b){ return b.score - a.score; });
  return res;
}
function score(text, pat){
  if (!text || !pat) return 0;
  text = String(text).toLowerCase(); pat = String(pat).toLowerCase();
  if (text === pat) return 200;
  if (text.indexOf(pat) === 0) return 160 - Math.min(text.length, 30);
  var idx = text.indexOf(pat);
  if (idx >= 0) return 140 - idx * 0.6;
  var ti=0, pi=0, first=-1, last=-1, mt=0;
  while (ti < text.length && pi < pat.length){
    if (text.charAt(ti) === pat.charAt(pi)){ if (first < 0) first = ti; last = ti; mt++; pi++; }
    ti++;
  }
  if (pi === pat.length){
    var span = last - first + 1;
    return 60 + (mt/span)*25 + (mt/pat.length)*15;
  }
  return 0;
}
function highlight(text, kw){
  var safe = escapeHtml(text);
  if (!kw) return safe;
  var esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try{ return safe.replace(new RegExp('('+esc+')','ig'), '<mark>$1</mark>'); }
  catch(e){ return safe; }
}

function setupDrag(el, idx){
  el.addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var sx = e.clientX, sy = e.clientY, sr = el.getBoundingClientRect();
    var ox = e.clientX - sr.left, oy = e.clientY - sr.top, pid = e.pointerId;
    var drag = false, ghost = null, target = idx;
    function onMove(ev){
      if (ev.pointerId !== pid) return;
      if (!drag){
        var dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (ev.pointerType !== 'mouse' && Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)*1.5){ cleanup(); return; }
        if (Math.sqrt(dx*dx+dy*dy) < 6) return;
        drag = true; el.setPointerCapture(pid); el.classList.add('dragging');
        ghost = el.cloneNode(true); ghost.className = el.className + ' dghost';
        ghost.style.width = sr.width + 'px'; ghost.style.left = sr.left + 'px'; ghost.style.top = sr.top + 'px';
        document.body.appendChild(ghost);
      }
      ev.preventDefault();
      ghost.style.left = (ev.clientX - ox) + 'px';
      ghost.style.top = (ev.clientY - oy) + 'px';
      target = updDrop(ev.clientY, idx);
    }
    function onUp(ev){
      if (ev.pointerId !== pid) return;
      var wasDrag = drag, t = target; cleanup();
      if (!wasDrag) return;
      if (t !== idx){ var m = state.blocks.splice(idx, 1)[0]; state.blocks.splice(t, 0, m); renderWorkspace(); toast('↕️ 位置 ' + (t+1)); }
      else renderWorkspace();
    }
    function onCancel(ev){ if (ev.pointerId !== pid) return; cleanup(); renderWorkspace(); }
    function cleanup(){
      if (ghost){ ghost.remove(); ghost = null; }
      var l = document.getElementById('dline'); if (l) l.style.display = 'none';
      el.classList.remove('dragging');
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onCancel);
    }
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onCancel);
  });
}
function updDrop(cy, dragIdx){
  var items = [].slice.call(document.querySelectorAll('#dz .bi'));
  var p = 0, i, it, r;
  for (i=0;i<items.length;i++){
    it = items[i]; if (parseInt(it.getAttribute('data-idx'), 10) === dragIdx) continue;
    r = it.getBoundingClientRect();
    if (cy > r.top + r.height/2) p = parseInt(it.getAttribute('data-idx'), 10) + 1;
  }
  var fp = p > dragIdx ? p - 1 : p;
  var line = document.getElementById('dline');
  if (!line){ line = document.createElement('div'); line.id = 'dline'; line.className = 'dline'; document.body.appendChild(line); }
  if (fp === dragIdx){ line.style.display = 'none'; return fp; }
  var y = null, x = null, w = null;
  for (i=0;i<items.length;i++){
    it = items[i]; if (parseInt(it.getAttribute('data-idx'), 10) === dragIdx) continue;
    r = it.getBoundingClientRect();
    if (cy < r.top + r.height/2){ y = r.top; x = r.left; w = r.width; break; }
  }
  if (y === null){
    for (i=items.length-1;i>=0;i--){
      it = items[i]; if (parseInt(it.getAttribute('data-idx'), 10) === dragIdx) continue;
      r = it.getBoundingClientRect();
      y = r.bottom; x = r.left; w = r.width; break;
    }
  }
  if (y === null){ line.style.display = 'none'; return fp; }
  line.style.display = 'block'; line.style.left = x + 'px'; line.style.width = w + 'px'; line.style.top = (y-2) + 'px';
  return fp;
}

function genJava(){
  if (!state.blocks.length) return '// 请添加积木';
  var lines = [], ind = 0;
  var topLevel = {'pkg':1,'import':1,'import_util':1,'import_io':1,'import_nio':1,'import_time':1,'import_swing':1,'import_awt':1,'import_concurrent':1,'import_stream':1,'import_sql':1,'import_net':1,'import_static':1};
  state.blocks.forEach(function(b){
    var code = b.def.genJava(b.values) || '';
    var pad = topLevel[b.defId] ? '' : '    '.repeat(ind);
    if (b.def.ctrlStart){ lines.push(pad + code); ind++; }
    else if (b.def.ctrlMiddle){ ind = Math.max(0, ind-1); lines.push('    '.repeat(ind)+code); ind++; }
    else if (b.def.ctrlEnd){ ind = Math.max(0, ind-1); lines.push('    '.repeat(ind)+code); }
    else lines.push(pad + code);
  });
  var hasPkg = state.blocks.some(function(b){ return b.defId === 'pkg'; });
  var hasImp = state.blocks.some(function(b){ return b.defId.indexOf('import') === 0; });
  if (!hasPkg && !hasImp) lines.unshift('// 自动生成的 Java 代码\n// 由 Java Master 积木生成');
  return lines.join('\n');
}

function fmt(v){
  if (v === undefined || v === null) return 'null';
  var t = typeof v;
  if (t === 'number'){
    if (!isFinite(v)) return String(v);
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v*1e10)/1e10);
  }
  if (t === 'string' || t === 'boolean') return String(v);
  if (Array.isArray(v)) return '[' + v.map(fmt).join(', ') + ']';
  if (v instanceof JMap){ var a=[]; v.m.forEach(function(val,key){ a.push(key+'='+fmt(val)); }); return '{'+a.join(', ')+'}'; }
  if (v instanceof JSet) return '[' + Array.from(v.s).map(fmt).join(', ') + ']';
  if (v instanceof JErr) return v.msg;
  if (v && typeof v.getMessage === 'function') return String(v.getMessage());
  try { return String(v); } catch(e){ return '?'; }
}
function toNum(v, d){
  var n = typeof v === 'number' ? v : parseFloat(v);
  return isNaN(n) ? (d === undefined ? 0 : d) : n;
}
function truthy(v){ return !!v; }
function unquote(s){
  s = (s === undefined || s === null) ? '' : String(s);
  if (s.length >= 2){
    var a = s.charAt(0), b = s.charAt(s.length-1);
    if ((a === '"' && b === '"') || (a === "'" && b === "'")) return s.slice(1, -1);
  }
  return s;
}
function errMessage(e){
  if (!e) return '未知错误';
  if (e instanceof JErr) return e.msg;
  return e.message || String(e);
}

function evalExpr(expr, ctx){
  if (expr === undefined || expr === null) return undefined;
  var s = String(expr).trim();
  if (!s) return undefined;
  s = s.replace(/\.length\s*\(\s*\)/g, '.length');
  var names = [], vals = [];
  for (var k in ctx.vars){
    if (!Object.prototype.hasOwnProperty.call(ctx.vars, k)) continue;
    if (!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k)) continue;
    if (RESERVED[k]) continue;
    names.push(k); vals.push(ctx.vars[k]);
  }
  try {
    var fn = new Function(names.join(','), '"use strict";return (' + s + ');');
    return fn.apply(null, vals);
  } catch(e){
    return undefined;
  }
}
function ev(expr, ctx, dflt){
  var r = evalExpr(expr, ctx);
  return r === undefined ? dflt : r;
}
function applyOp(a, b, op){
  switch(op){
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': if (b === 0) throw new JErr('ArithmeticException: / by zero'); return a / b;
    case '%': return a % b;
    case '&': return a & b;
    case '|': return a | b;
    case '^': return a ^ b;
    case '<<': return a << b;
    case '>>': return a >> b;
    case '>>>': return a >>> b;
  }
  return 0;
}
function toArray(coll){
  if (coll === undefined || coll === null) return [];
  if (Array.isArray(coll)) return coll;
  if (typeof coll === 'string') return coll.split('');
  if (coll instanceof JSet) return Array.from(coll.s);
  if (coll instanceof JMap) return Array.from(coll.m.keys());
  return [];
}

  return null;

H.continue = function(){ return 'continue'; };
H.return = function(n, ctx){ return { ret: evalExpr(n.v.expr, ctx) }; };
H.return_void = function(){ return { ret: undefined }; };
H.throw = function(n, ctx){ throw new JErr((n.v.type || 'Exception') + ': ' + (n.v.msg || '')); };
H.assert = function(n, ctx){
  if (!truthy(evalExpr(n.v.cond, ctx))) throw new JErr('AssertionError: ' + (n.v.msg || ''));
  return null;
};
H.yield = function(){ return null; };

H.math_abs = function(n, ctx){ ctx.vars[n.v.name] = Math.abs(toNum(ev(n.v.input, ctx, 0))); return null; };
H.math_pow = function(n, ctx){ ctx.vars[n.v.name] = Math.pow(toNum(ev(n.v.base, ctx, 0)), toNum(ev(n.v.exp, ctx, 0))); return null; };
H.math_sqrt = function(n, ctx){ ctx.vars[n.v.name] = Math.sqrt(toNum(ev(n.v.input, ctx, 0))); return null; };
H.math_max = function(n, ctx){ ctx.vars[n.v.name] = Math.max(toNum(ev(n.v.a, ctx, 0)), toNum(ev(n.v.b, ctx, 0))); return null; };
H.math_min = function(n, ctx){ ctx.vars[n.v.name] = Math.min(toNum(ev(n.v.a, ctx, 0)), toNum(ev(n.v.b, ctx, 0))); return null; };
H.math_round = function(n, ctx){ ctx.vars[n.v.name] = Math.round(toNum(ev(n.v.input, ctx, 0))); return null; };
H.math_floor = function(n, ctx){ ctx.vars[n.v.name] = Math.floor(toNum(ev(n.v.input, ctx, 0))); return null; };
H.math_ceil  = function(n, ctx){ ctx.vars[n.v.name] = Math.ceil(toNum(ev(n.v.input, ctx, 0))); return null; };
H.math_random = function(n, ctx){ ctx.vars[n.v.name] = Math.random(); return null; };
H.math_pi = function(n, ctx){ ctx.vars[n.v.name] = Math.PI; return null; };

H.system_time = function(n, ctx){ ctx.vars[n.v.name] = Date.now(); return null; };
H.system_nano = function(n, ctx){ ctx.vars[n.v.name] = (typeof performance !== 'undefined' ? performance.now() : Date.now()) * 1e6; return null; };
H.objects_equals = function(n, ctx){ ctx.vars[n.v.name] = (ctx.vars[n.v.a] === ctx.vars[n.v.b]); return null; };

H.gfx_color = function(n, ctx){
  ctx.gfx.push({ t:'color', v:'rgb(' + toNum(ev(n.v.r, ctx, 0)) + ',' + toNum(ev(n.v.g, ctx, 0)) + ',' + toNum(ev(n.v.b, ctx, 0)) + ')' });
  return null;
};
H.gfx_rect = function(n, ctx){
  ctx.gfx.push({ t:'rect', x:toNum(ev(n.v.x, ctx, 0)), y:toNum(ev(n.v.y, ctx, 0)), w:toNum(ev(n.v.w, ctx, 0)), h:toNum(ev(n.v.h, ctx, 0)) });
  return null;
};
H.gfx_oval = function(n, ctx){
  ctx.gfx.push({ t:'oval', x:toNum(ev(n.v.x, ctx, 0)), y:toNum(ev(n.v.y, ctx, 0)), w:toNum(ev(n.v.w, ctx, 0)), h:toNum(ev(n.v.h, ctx, 0)) });
  return null;
};
H.gfx_roundrect = function(n, ctx){
  ctx.gfx.push({ t:'roundrect', x:toNum(ev(n.v.x, ctx, 0)), y:toNum(ev(n.v.y, ctx, 0)), w:toNum(ev(n.v.w, ctx, 0)), h:toNum(ev(n.v.h, ctx, 0)), arc:toNum(ev(n.v.arc, ctx, 10)) });
  return null;
};
H.gfx_line = function(n, ctx){
  ctx.gfx.push({ t:'line', x1:toNum(ev(n.v.x1, ctx, 0)), y1:toNum(ev(n.v.y1, ctx, 0)), x2:toNum(ev(n.v.x2, ctx, 0)), y2:toNum(ev(n.v.y2, ctx, 0)) });
  return null;
};
H.gfx_text = function(n, ctx){
  ctx.gfx.push({ t:'text', s:unquote(n.v.text), x:toNum(ev(n.v.x, ctx, 0)), y:toNum(ev(n.v.y, ctx, 0)) });
  return null;
};
H.gfx_font = function(n, ctx){
  var st = String(n.v.style || 'Font.PLAIN');
  var pre = '';
  if (st.indexOf('BOLD') >= 0) pre += 'bold ';
  if (st.indexOf('ITALIC') >= 0) pre += 'italic ';
  ctx.gfx.push({ t:'font', v: pre + toNum(ev(n.v.size, ctx, 14)) + 'px ' + (n.v.name || 'sans-serif') });
  return null;
};
H.gfx_hint = function(){ return null; };

H.swing_jframe = function(n, ctx){
  ctx.gfx.push({ t:'clear' });
  var ttl = unquote(n.v.title);
  if (ttl) ctx.gfx.push({ t:'text', s:ttl, x:12, y:20, title:true });
  return null;
};
H.swing_jframe_size = function(n, ctx){
  ctx.gfx.push({ t:'canvasSize', w:toNum(ev(n.v.w, ctx, 500)), h:toNum(ev(n.v.h, ctx, 300)) });
  return null;
};
H.swing_jframe_close = function(){ return null; };
H.swing_jframe_center = function(){ return null; };
H.swing_jframe_visible = function(){ return null; };

H.uuid = function(n, ctx){
  var s = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
  ctx.vars[n.v.name] = s;
  return null;
};
H.base64_enc = function(n, ctx){
  try{ ctx.vars[n.v.name] = btoa(unescape(encodeURIComponent(String(ctx.vars[n.v.input] || '')))); }
  catch(e){ ctx.vars[n.v.name] = ''; }
  return null;
};
H.md5 = H.sha1 = H.sha256 = function(n, ctx){
  var s = String(ctx.vars[n.v.input] || '');
  var h = 0; for (var i=0;i<s.length;i++){ h = ((h<<5)-h+s.charCodeAt(i))|0; }
  ctx.vars[n.v.name] = [h];
  return null;
};

function buildTree(blocks){
  var root = { id:'__root__', children: [] };
  var stack = [root];
  blocks.forEach(function(b){
    var d = b.def;
    var node = { b:b, id:b.defId, v:b.values, children:[] };
    var top = stack[stack.length-1];
    if (d.ctrlMiddle){
      if (stack.length > 1) stack.pop();
      var par = stack[stack.length-1];
      par.children.push(node);
      stack.push(node);
    } else if (d.ctrlStart){
      top.children.push(node);
      stack.push(node);
    } else if (d.ctrlEnd){
      var closed = stack.length > 1 ? stack.pop() : null;
      if (closed) closed.end = node;
    } else {
      top.children.push(node);
    }
  });
  return root;
}

function execNode(node, ctx){
  var h = H[node.id];
  if (h) return h(node, ctx);
  return null;
}

function execChildren(children, ctx){
  for (var i=0;i<children.length;i++){
    var node = children[i];

    if (node.id === 'if' || node.id === 'elseif' || node.id === 'else'){
      var matched = false, j = i;
      for (; j < children.length; j++){
        var nn = children[j];
        if (nn.id !== 'if' && nn.id !== 'elseif' && nn.id !== 'else') break;
        if (matched) continue;
        var ok = (nn.id === 'else') ? true : truthy(evalExpr(nn.v.cond, ctx));
        if (ok){
          matched = true;
          var sg = execChildren(nn.children, ctx);
          if (sg) return sg;
        }
      }
      i = j - 1;
      continue;
    }

    if (node.id === 'try' || node.id === 'try_resource'){
      var caught = null;
      try {
        var s1 = execChildren(node.children, ctx);
        if (s1) return s1;
      } catch(e){ caught = e; }

      var k = i + 1;
      for (; k < children.length; k++){
        var cn = children[k];
        if (cn.id === 'catch'){
          if (caught){
            ctx.vars[cn.v.name || 'e'] = new JErr(errMessage(caught));
            caught = null;
            var s2 = execChildren(cn.children, ctx);
            if (s2) return s2;
          }
        } else if (cn.id === 'finally'){
          var s3 = execChildren(cn.children, ctx);
          if (s3) return s3;
        } else break;
      }
      i = k - 1;
      if (caught) throw caught;
      continue;
    }

    var res = execNode(node, ctx);
    if (res) return res;
  }
  return null;
}

var canvasEmptyEl = null;

function ensureCanvasPanel(){
  var right = document.querySelector('.right');
  if (!right || document.getElementById('cv')) return;

  var panel = document.createElement('div');
  panel.className = 'rp';
  panel.style.flex = '1.15';
  panel.id = 'cvPanel';
  panel.innerHTML =
    '<div class="rh">' +
      '<span>🎨 画布</span>' +
      '<span class="rh-acts">' +
        '<button id="bCvFull" title="全屏">⛶</button>' +
        '<button id="bCvClr" title="清空">🧹</button>' +
      '</span>' +
    '</div>' +
    '<div class="cv-wrap" id="cvWrap">' +
      '<canvas id="cv"></canvas>' +
      '<div class="cv-empty" id="cvEmpty"><span class="big">🎨</span>用「图形」分类的积木<br>在这里绘制结果</div>' +
    '</div>';
  right.appendChild(panel);

  var clearBtn = panel.querySelector('#bCvClr');
  var fullBtn = panel.querySelector('#bCvFull');

  clearBtn.addEventListener('click', function(){
    var cv = document.getElementById('cv');
    if (cv){
      var g = cv.getContext('2d');
      g.setTransform(1,0,0,1,0,0);
      g.fillStyle = '#ffffff';
      g.fillRect(0,0,cv.width,cv.height);
    }
    if (canvasEmptyEl) canvasEmptyEl.style.display = 'flex';
    toast('🧹 画布已清空');
  });

  fullBtn.addEventListener('click', function(){
    panel.classList.toggle('fullscreen');
    setTimeout(resizeCanvas, 60);
  });

  canvasEmptyEl = panel.querySelector('#cvEmpty');

  if (window.ResizeObserver){
    try { new ResizeObserver(function(){ resizeCanvas(); }).observe(document.getElementById('cvWrap')); }
    catch(e){}
  }
  window.addEventListener('resize', resizeCanvas);
}

function resizeCanvas(){
  var cv = document.getElementById('cv');
  var wrap = document.getElementById('cvWrap');
  if (!cv || !wrap) return;
  var w = wrap.clientWidth || 300, h = wrap.clientHeight || 200;
  var dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  var g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, w, h);
}

function renderCanvas(gfx, canvasSize){
  ensureCanvasPanel();
  var cv = document.getElementById('cv');
  var wrap = document.getElementById('cvWrap');
  if (!cv || !wrap) return;

  var userW = 500, userH = 300;
  if (canvasSize){ userW = canvasSize.w; userH = canvasSize.h; }

  var wrapW = wrap.clientWidth || 300, wrapH = wrap.clientHeight || 200;
  var scale = Math.min(wrapW / userW, wrapH / userH, 1);
  if (!isFinite(scale) || scale <= 0) scale = 1;

  var dpr = window.devicePixelRatio || 1;
  var cw = Math.max(1, Math.round(wrapW * dpr));
  var ch = Math.max(1, Math.round(wrapH * dpr));
  if (cv.width !== cw || cv.height !== ch){
    cv.width = cw; cv.height = ch;
    cv.style.width = wrapW + 'px';
    cv.style.height = wrapH + 'px';
  }

  var g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#f2f5f9';
  g.fillRect(0, 0, wrapW, wrapH);

  var ox = (wrapW - userW * scale) / 2;
  var oy = (wrapH - userH * scale) / 2;
  g.save();
  g.translate(ox, oy);
  g.scale(scale, scale);
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, userW, userH);
  g.strokeStyle = '#dce2ea';
  g.lineWidth = 1 / scale;
  g.strokeRect(0, 0, userW, userH);

  var hasDraw = false;
  var state = { fill: '#2c3e50', stroke: '#2c3e50', font: '14px sans-serif' };

  g.fillStyle = state.fill;
  g.strokeStyle = state.stroke;
  g.font = state.font;
  g.textBaseline = 'alphabetic';

  gfx.forEach(function(c){
    switch(c.t){
      case 'clear':
        g.fillStyle = '#ffffff';
        g.fillRect(0, 0, userW, userH);
        break;
      case 'color':
        state.fill = c.v; state.stroke = c.v;
        g.fillStyle = c.v; g.strokeStyle = c.v;
        break;
      case 'font':
        state.font = c.v; g.font = c.v;
        break;
      case 'rect':
        hasDraw = true;
        g.fillStyle = state.fill;
        g.fillRect(c.x, c.y, c.w, c.h);
        break;
      case 'oval':
        hasDraw = true;
        g.fillStyle = state.fill;
        g.beginPath();
        g.ellipse(c.x + c.w/2, c.y + c.h/2, Math.abs(c.w/2), Math.abs(c.h/2), 0, 0, Math.PI*2);
        g.fill();
        break;
      case 'roundrect':
        hasDraw = true;
        g.fillStyle = state.fill;
        g.beginPath();
        var r = Math.min(c.arc, c.w/2, c.h/2);
        g.moveTo(c.x + r, c.y);
        g.lineTo(c.x + c.w - r, c.y);
        g.quadraticCurveTo(c.x + c.w, c.y, c.x + c.w, c.y + r);
        g.lineTo(c.x + c.w, c.y + c.h - r);
        g.quadraticCurveTo(c.x + c.w, c.y + c.h, c.x + c.w - r, c.y + c.h);
        g.lineTo(c.x + r, c.y + c.h);
        g.quadraticCurveTo(c.x, c.y + c.h, c.x, c.y + c.h - r);
        g.lineTo(c.x, c.y + r);
        g.quadraticCurveTo(c.x, c.y, c.x + r, c.y);
        g.closePath();
        g.fill();
        break;
      case 'line':
        hasDraw = true;
        g.strokeStyle = state.stroke;
        g.beginPath();
        g.moveTo(c.x1, c.y1);
        g.lineTo(c.x2, c.y2);
        g.stroke();
        break;
      case 'text':
        hasDraw = true;
        g.fillStyle = c.title ? '#7f8c8d' : state.fill;
        g.font = c.title ? '12px sans-serif' : state.font;
        g.fillText(c.s, c.x, c.y);
        g.font = state.font;
        break;
    }
  });

  g.restore();

  if (canvasEmptyEl) canvasEmptyEl.style.display = hasDraw ? 'none' : 'flex';
}

function runProgram2(){
  var ro = $('ro');
  if (!ro) return;

  if (!state.blocks.length){
    ro.innerHTML = '<div class="line ok">▶ 请先添加积木</div>';
    renderCanvas([], null);
    return;
  }

  var root = buildTree(state.blocks);
  var ctx = { vars: {}, lines: [], gfx: [], canvasSize: null };

  var origPush = ctx.gfx.push.bind(ctx.gfx);
  ctx.gfx.push = function(cmd){
    if (cmd && cmd.t === 'canvasSize'){ ctx.canvasSize = { w: cmd.w, h: cmd.h }; return ctx.gfx.length; }
    return origPush(cmd);
  };

  var err = null, retVal = undefined;
  var t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  try {
    var sig = execChildren(root.children, ctx);
    if (sig && typeof sig === 'object' && 'ret' in sig) retVal = sig.ret;
  } catch(e){
    err = e;
  }
  var t1 = (typeof performance !== 'undefined' ? performance.now() : Date.now());

  var html = '';
  html += '<div class="line head">▶ 运行结果 <span style="color:#95a5a6;font-weight:400">（' + ctx.lines.length + ' 行输出 · ' + Math.round(t1 - t0) + 'ms）</span></div>';

  if (!ctx.lines.length && !err){
    html += '<div class="line" style="color:#aab4c0">（程序没有产生输出，试试加个 System.out.println）</div>';
  }
  ctx.lines.forEach(function(l){
    html += '<div class="line ok">' + escapeHtml(l) + '</div>';
  });
  if (err){
    html += '<div class="line err">💥 ' + escapeHtml(errMessage(err)) + '</div>';
  } else {
    html += '<div class="line ok" style="margin-top:6px;border:none">✅ 执行完成</div>';
  }

  var gfxCount = ctx.gfx.filter(function(c){ return c.t !== 'clear' && c.t !== 'canvasSize'; }).length;
  if (gfxCount) html += '<div class="line" style="color:#8e44ad">🎨 已绘制 ' + gfxCount + ' 个图形到画布</div>';

  ro.innerHTML = html;

  renderCanvas(ctx.gfx, ctx.canvasSize);

  toast(err ? '💥 运行出错' : '✅ 运行完成');
}

function boot(){
  ensureCanvasPanel();

  var ros = document.querySelectorAll('.rh > span');
  for (var i=0;i<ros.length;i++){
    if (ros[i].textContent.indexOf('结构说明') >= 0) ros[i].textContent = '🖥 运行结果';
  }

  var bRun = $('bRun');
  if (bRun) bRun.onclick = runProgram2;

  var bClrRun = $('bClrRun');
  if (bClrRun){
    bClrRun.onclick = function(){
      var ro = $('ro');
      if (ro) ro.innerHTML = '<div class="line ok">▶ 点击顶部「▶ 运行」查看输出</div>';
      renderCanvas([], null);
    };
  }

  setTimeout(function(){ resizeCanvas(); }, 120);
  setTimeout(function(){ resizeCanvas(); }, 500);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>

  image:   ['src','fit','bg','radius','opacity','shadow','borderW','borderColor'],
  divider: ['bg','opacity'],
  badge:   ['text','bg','color','fontSize','fontWeight','radius','opacity','shadow'],
  avatar:  ['text','bg','radius','opacity','shadow','borderW','borderColor']
};

/* ---------------- 状态 ---------------- */
var DZ = {
  built: false,
  els: [],
  sel: null,
  nextId: 1,
  cw: 1000,
  ch: 600,
  scale: 1,
  bg: { type:'gradient', a:'#667eea', b:'#764ba2', c:'#ffffff', url:'' }
};

/* ---------------- 小工具 ---------------- */
function findEl(id){
  for (var i=0;i<DZ.els.length;i++) if (DZ.els[i].id === id) return DZ.els[i];
  return null;
}
function toHex(c){
  c = String(c||'');
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  if (/^#[0-9a-f]{3}$/i.test(c)) return '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  var m = c.match(/rgba?\(([^)]+)\)/);
  if (m){
    var p = m[1].split(',').map(function(x){ return parseFloat(x); });
    var h = function(v){ v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); };
    return '#' + h(p[0]) + h(p[1]) + h(p[2]);
  }
  return '#ffffff';
}
function esc(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stageBgCSS(){
  var b = DZ.bg;
  if (b.type === 'solid') return b.c;
  if (b.type === 'gradient') return 'linear-gradient(135deg, ' + b.a + ' 0%, ' + b.b + ' 100%)';
  if (b.type === 'image' && b.url) return 'url("' + b.url + '") center/cover no-repeat';
  return '#ffffff';
}

/* ---------------- 元素创建 ---------------- */
function newEl(type, x, y){
  var t = EL_TYPES[type];
  var el = { id: 'e' + (DZ.nextId++), type: type, x: x, y: y, w: t.w, h: t.h };
  for (var k in t.def) el[k] = t.def[k];
  el.text = t.text || '';
  return el;
}
function addEl(type, opts){
  var t = EL_TYPES[type];
  var n = DZ.els.length;
  var x = Math.round((DZ.cw - t.w) / 2 + (n % 5) * 22 - 44);
  var y = Math.round((DZ.ch - t.h) / 2 + (n % 5) * 22 - 44);
  var el = newEl(type, x, y);
  if (opts) for (var k in opts) el[k] = opts[k];
  DZ.els.push(el);
  DZ.sel = el.id;
  renderDesign();
  return el;
}

/* ---------------- 样式应用 ---------------- */
function applyStyle(node, el){
  node.style.left = el.x + 'px';
  node.style.top = el.y + 'px';
  node.style.width = el.w + 'px';
  node.style.height = el.h + 'px';
  node.style.background = el.bg || 'transparent';
  node.style.borderRadius = (el.radius || 0) + 'px';
  node.style.opacity = (el.opacity === undefined ? 100 : el.opacity) / 100;
  node.style.color = el.color || '#2c3e50';
  node.style.fontSize = (el.fontSize || 15) + 'px';
  node.style.fontWeight = el.fontWeight || 600;
  var jc = el.align === 'left' ? 'flex-start' : (el.align === 'right' ? 'flex-end' : 'center');
  node.style.justifyContent = jc;
  node.style.textAlign = el.align || 'center';
  node.style.boxShadow = el.shadow ? '0 10px 30px rgba(0,0,0,.18)' : 'none';
  var bf = el.blur ? 'blur(' + el.blur + 'px)' : '';
  node.style.backdropFilter = bf;
  node.style.webkitBackdropFilter = bf;
  node.style.border = el.borderW ? el.borderW + 'px solid ' + (el.borderColor || '#ffffff') : 'none';
  var fillImg = (el.type === 'image' && el.src);
  node.style.padding = (el.type === 'divider' || fillImg) ? '0' : '0 10px';
  if (el.type === 'image' && !el.src) node.style.padding = '0';
}

function innerHTMLFor(el){
  if (el.type === 'image'){
    return el.src
      ? '<img src="' + esc(el.src) + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:' + (el.fit || 'cover') + ';border-radius:inherit;display:block">'
      : '<span style="font-size:28px;opacity:.6">🖼️</span>';
  }
  if (el.type === 'input') return '<span style="opacity:.5;font-size:' + (el.fontSize||14) + 'px">' + esc(el.placeholder || '请输入...') + '</span>';
  if (el.type === 'divider') return '';
  if (el.type === 'avatar') return '<span style="font-size:' + Math.round(Math.min(el.w, el.h) * 0.5) + 'px;line-height:1">' + esc(el.text || '👤') + '</span>';
  var t = esc(el.text || '');
  if (el.type === 'link' && el.underline !== 0) t = '<span style="text-decoration:underline">' + t + '</span>';
  return t;
}

function buildEl(el){
  var node = document.createElement('div');
  node.className = 'de-el' + (DZ.sel === el.id ? ' sel' : '');
  node.setAttribute('data-id', el.id);
  applyStyle(node, el);
  node.innerHTML = '<span class="de-inner">' + innerHTMLFor(el) + '</span><div class="de-handle"></div>';

  node.addEventListener('pointerdown', function(e){
    if (e.target.classList.contains('de-handle')){
      e.stopPropagation();
      selectEl(el.id);
      startDrag(e, el, 'resize');
      return;
    }
    e.stopPropagation();
    selectEl(el.id);
    if (node.getAttribute('contenteditable') === 'true') return;
    startDrag(e, el, 'move');
  });

  node.addEventListener('dblclick', function(e){
    e.stopPropagation();
    var editable = ['text','button','link','badge','avatar'];
    if (editable.indexOf(el.type) < 0) return;
    var savedHTML = node.innerHTML;
    node.setAttribute('contenteditable', 'true');
    node.innerHTML = esc(el.text || '');
    node.focus();
    try{
      var r = document.createRange();
      r.selectNodeContents(node);
      var s = window.getSelection();
      s.removeAllRanges(); s.addRange(r);
    }catch(err){}
    function done(){
      node.removeAttribute('contenteditable');
      var v = node.innerText || node.textContent || '';
      el.text = v;
      node.innerHTML = savedHTML;
      renderDesign();
    }
    node.addEventListener('blur', done, { once: true });
    node.addEventListener('keydown', function ke(ev){
      if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); node.blur(); }
      if (ev.key === 'Escape'){ node.blur(); }
    });
  });

  return node;
}

/* ---------------- 拖动 / 缩放 ---------------- */
function startDrag(e, el, mode){
  if (e.preventDefault) e.preventDefault();
  var sx = e.clientX, sy = e.clientY;
  var ox = el.x, oy = el.y, ow = el.w, oh = el.h;
  var k = DZ.scale || 1;
  var pid = e.pointerId;
  var node = document.querySelector('.de-el[data-id="' + el.id + '"]');
  if (!node) return;

  try { node.setPointerCapture(pid); } catch(err){}

  function onMove(ev){
    if (ev.pointerId !== pid) return;
    var dx = (ev.clientX - sx) / k;
    var dy = (ev.clientY - sy) / k;
    if (mode === 'move'){
      el.x = Math.round(ox + dx);
      el.y = Math.round(oy + dy);
    } else {
      el.w = Math.max(10, Math.round(ow + dx));
      el.h = Math.max(4, Math.round(oh + dy));
    }
    applyStyle(node, el);
    syncSizeInputs(el);
  }
  function onUp(ev){
    if (ev.pointerId !== pid) return;
    node.removeEventListener('pointermove', onMove);
    node.removeEventListener('pointerup', onUp);
    node.removeEventListener('pointercancel', onUp);
    renderLayerList();
    updateInspector();
  }
  node.addEventListener('pointermove', onMove);
  node.addEventListener('pointerup', onUp);
  node.addEventListener('pointercancel', onUp);
}

function syncSizeInputs(el){
  var box = document.getElementById('dzPaneProps');
  if (!box) return;
  ['x','y','w','h'].forEach(function(k){
    var inp = box.querySelector('[data-pk="' + k + '"]');
    if (inp && document.activeElement !== inp) inp.value = el[k];
  });
}

/* ---------------- 渲染 ---------------- */
function selectEl(id){
  DZ.sel = id;
  var nodes = document.querySelectorAll('.de-el');
  for (var i=0;i<nodes.length;i++){
    nodes[i].classList.toggle('sel', nodes[i].getAttribute('data-id') === id);
  }
  updateInspector();
  renderLayerList();
}

function renderDesign(){
  var stage = document.getElementById('dzStage');
  if (!stage) return;
  stage.innerHTML = '';
  stage.style.width = DZ.cw + 'px';
  stage.style.height = DZ.ch + 'px';
  stage.style.background = stageBgCSS();
  DZ.els.forEach(function(el){ stage.appendChild(buildEl(el)); });

  var info = document.getElementById('dzInfo');
  if (info) info.textContent = DZ.els.length + ' 个元素 · ' + DZ.cw + '×' + DZ.ch;

  renderLayerList();
  updateInspector();
  fitCanvas();
}

function refreshEl(el){
  var node = document.querySelector('.de-el[data-id="' + el.id + '"]');
  if (!node) return;
  applyStyle(node, el);
  var inner = node.querySelector('.de-inner');
  if (inner) inner.innerHTML = innerHTMLFor(el);
}

/* ---------------- 画布缩放 ---------------- */
function fitCanvas(){
  var wrap = document.getElementById('dzWrap');
  var stage = document.getElementById('dzStage');
  var holder = document.getElementById('dzHolder');
  if (!wrap || !stage || !holder) return;

  var availW = wrap.clientWidth - 44;
  var availH = wrap.clientHeight - 44;
  var k = Math.min(availW / DZ.cw, availH / DZ.ch, 1);
  if (!isFinite(k) || k <= 0) k = 1;
  DZ.scale = k;

  stage.style.transform = 'scale(' + k + ')';
  stage.style.transformOrigin = 'top left';
  stage.style.width = DZ.cw + 'px';
  stage.style.height = DZ.ch + 'px';
  holder.style.width = (DZ.cw * k) + 'px';
  holder.style.height = (DZ.ch * k) + 'px';
  holder.style.position = 'relative';
  stage.style.position = 'absolute';
  stage.style.left = '0';
  stage.style.top = '0';
}

/* ---------------- 属性面板 ---------------- */
function fieldHTML(k, el){
  var p = PROPS[k];
  if (!p) return '';
  var v = el[k];
  if (v === undefined || v === null) v = '';
  if (p.t === 'color'){
    return '<div class="di-row"><label>' + p.l + '</label>'
      + '<div class="di-color">'
      + '<input type="color" data-cpick="' + k + '" value="' + toHex(v) + '">'
      + '<input type="text" data-pk="' + k + '" value="' + esc(v) + '">'
      + '</div></div>';
  }
  if (p.t === 'range'){
    return '<div class="di-row"><label>' + p.l + '</label>'
      + '<input type="range" data-pk="' + k + '" min="' + p.min + '" max="' + p.max + '" step="' + (p.step||1) + '" value="' + (v === '' ? 0 : v) + '">'
      + '<span class="di-val">' + (v === '' ? 0 : v) + '</span></div>';
  }
  if (p.t === 'check'){
    return '<div class="di-row"><label>' + p.l + '</label>'
      + '<span class="di-check"><input type="checkbox" data-pk="' + k + '" ' + (v ? 'checked' : '') + '> 开启</span></div>';
  }
  if (p.t === 'select'){
    var opts = p.opts.map(function(o){
      return '<option value="' + o[0] + '"' + (String(v) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
    return '<div class="di-row"><label>' + p.l + '</label><select data-pk="' + k + '">' + opts + '</select></div>';
  }
  return '<div class="di-row"><label>' + p.l + '</label><input type="text" data-pk="' + k + '" value="' + esc(v) + '"></div>';
}

function updateInspector(){
  var box = document.getElementById('dzPaneProps');
  if (!box) return;

  if (!DZ.sel){
    /* -------- 页面设置 -------- */
    var b = DZ.bg;
    box.innerHTML =
      '<div class="di-head">📄 页面设置</div>'
      + '<div class="di-sec"><div class="di-sec-t">画布尺寸</div>'
      + '<div class="di-grid2">'
      + '<div class="di-row"><label>宽</label><input type="number" data-page="cw" value="' + DZ.cw + '"></div>'
      + '<div class="di-row"><label>高</label><input type="number" data-page="ch" value="' + DZ.ch + '"></div>'
      + '</div></div>'
      + '<div class="di-sec"><div class="di-sec-t">背景</div>'
      + '<div class="di-row"><label>类型</label><select data-page="bgType">'
      + '<option value="solid"' + (b.type==='solid'?' selected':'') + '>纯色</option>'
      + '<option value="gradient"' + (b.type==='gradient'?' selected':'') + '>渐变</option>'
      + '<option value="image"' + (b.type==='image'?' selected':'') + '>图片</option>'
      + '</select></div>'
      + '<div class="di-row"><label>颜色A</label><div class="di-color"><input type="color" data-bg="a" value="' + toHex(b.a) + '"><input type="text" data-page="a" value="' + esc(b.a) + '"></div></div>'
      + '<div class="di-row"><label>颜色B</label><div class="di-color"><input type="color" data-bg="b" value="' + toHex(b.b) + '"><input type="text" data-page="b" value="' + esc(b.b) + '"></div></div>'
      + '<div class="di-row"><label>纯色</label><div class="di-color"><input type="color" data-bg="c" value="' + toHex(b.c) + '"><input type="text" data-page="c" value="' + esc(b.c) + '"></div></div>'
      + '<div class="di-row"><label>图片</label><input type="text" data-page="url" placeholder="https://... 或点下方上传" value="' + esc(b.url) + '"></div>'
      + '<div class="di-btnrow">'
      + '<button class="di-up" data-bgact="upload" style="flex:2">📤 上传本地背景图</button>'
      + '<button class="di-back" data-bgact="clear" style="flex:1">清除</button>'
      + '</div>'
      + '</div>'
      + '<div class="di-empty" style="padding:22px 8px">选中画布中的元素<br>即可编辑它的属性</div>';
    bindPageInspector();
    return;
  }

  var el = findEl(DZ.sel);
  if (!el){ DZ.sel = null; updateInspector(); return; }

  var fields = TYPE_FIELDS[el.type] || [];
  var html = '<div class="di-head">' + EL_TYPES[el.type].icon + ' ' + EL_TYPES[el.type].name + '</div>';

  html += '<div class="di-sec"><div class="di-sec-t">位置与尺寸</div><div class="di-grid2">'
    + '<div class="di-row"><label>X</label><input type="number" data-pk="x" value="' + el.x + '"></div>'
    + '<div class="di-row"><label>Y</label><input type="number" data-pk="y" value="' + el.y + '"></div>'
    + '<div class="di-row"><label>宽</label><input type="number" data-pk="w" value="' + el.w + '"></div>'
    + '<div class="di-row"><label>高</label><input type="number" data-pk="h" value="' + el.h + '"></div>'
    + '</div></div>';

  /* ⭐ 图片元素：上传区 */
  if (el.type === 'image'){
    html += '<div class="di-sec"><div class="di-sec-t">图片源</div>'
      + '<div class="di-btnrow">'
      + '<button class="di-up" data-act="upload" style="flex:2">📤 上传本地图片</button>'
      + '<button class="di-back" data-act="rmimg" style="flex:1">清除</button>'
      + '</div>'
      + '<div style="font-size:10px;color:#94a3b8;margin-top:6px;line-height:1.5">支持 JPG / PNG / GIF / WebP / SVG，也可直接粘贴图片地址</div>'
      + '</div>';
  }

  html += '<div class="di-sec"><div class="di-sec-t">样式</div>';
  fields.forEach(function(k){ html += fieldHTML(k, el); });
  html += '</div>';

  html += '<div class="di-btnrow">'
    + '<button class="di-dup" data-act="dup">📋 复制</button>'
    + '<button class="di-front" data-act="front">⬆ 置顶</button>'
    + '<button class="di-back" data-act="back">⬇ 置底</button>'
    + '<button class="di-del" data-act="del">🗑 删除</button>'
    + '</div>';

  box.innerHTML = html;
  bindInspector(box);
}

function bindInspector(box){
  /* 普通字段 */
  var inputs = box.querySelectorAll('[data-pk]');
  for (var i=0;i<inputs.length;i++){
    (function(inp){
      var k = inp.getAttribute('data-pk');
      var handler = function(){
        var el = findEl(DZ.sel); if (!el) return;
        var v = inp.value;
        if (inp.type === 'range' || inp.type === 'number') v = parseFloat(v) || 0;
        if (inp.type === 'checkbox') v = inp.checked ? 1 : 0;
        el[k] = v;
        var row = inp.closest('.di-row');
        var valEl = row ? row.querySelector('.di-val') : null;
        if (valEl && inp.type === 'range') valEl.textContent = v;
        refreshEl(el);
        if (k === 'x' || k === 'y' || k === 'w' || k === 'h') renderLayerList();
        if (k === 'text' || k === 'placeholder') renderLayerList();
      };
      inp.addEventListener('input', handler);
      inp.addEventListener('change', handler);
    })(inputs[i]);
  }
  /* 取色器 */
  var picks = box.querySelectorAll('[data-cpick]');
  for (var j=0;j<picks.length;j++){
    (function(cp){
      var k = cp.getAttribute('data-cpick');
      cp.addEventListener('input', function(){
        var el = findEl(DZ.sel); if (!el) return;
        el[k] = cp.value;
        var txt = box.querySelector('[data-pk="' + k + '"]');
        if (txt) txt.value = cp.value;
        refreshEl(el);
      });
    })(picks[j]);
  }
  /* 操作按钮 */
  var acts = box.querySelectorAll('[data-act]');
  for (var m=0;m<acts.length;m++){
    (function(btn){
      btn.addEventListener('click', function(){
        var el = findEl(DZ.sel);
        if (!el) return;
        var a = btn.getAttribute('data-act');
        if (a === 'del') removeEl(el.id);
        else if (a === 'dup') duplicateEl(el);
        else if (a === 'front') moveToEnd(el);
        else if (a === 'back') moveToStart(el);
        else if (a === 'upload'){
          window.pickImage(function(dataUrl){
            el.src = dataUrl;
            el.fit = el.fit || 'cover';
            refreshEl(el);
            updateInspector();
            toast('📤 图片已上传');
          });
        }
        else if (a === 'rmimg'){
          el.src = '';
          refreshEl(el);
          updateInspector();
          toast('已清除图片');
        }
      });
    })(acts[m]);
  }
}

function bindPageInspector(){
  var box = document.getElementById('dzPaneProps');
  if (!box) return;
  var nums = box.querySelectorAll('[data-page]');
  for (var i=0;i<nums.length;i++){
    (function(inp){
      var k = inp.getAttribute('data-page');
      inp.addEventListener('input', function(){
        var v = inp.value;
        if (k === 'cw' || k === 'ch'){ v = Math.max(120, Math.min(3000, parseFloat(v) || 600)); }
        if (k === 'bgType'){ DZ.bg.type = v; }
        else if (k === 'cw' || k === 'ch'){ DZ[k] = v; }
        else { DZ.bg[k] = v; }
        renderDesign();
      });
      inp.addEventListener('change', function(){ inp.dispatchEvent(new Event('input')); });
    })(nums[i]);
  }
  var picks = box.querySelectorAll('[data-bg]');
  for (var j=0;j<picks.length;j++){
    (function(cp){
      var k = cp.getAttribute('data-bg');
      cp.addEventListener('input', function(){
        DZ.bg[k] = cp.value;
        var txt = box.querySelector('[data-page="' + k + '"]');
        if (txt) txt.value = cp.value;
        var stage = document.getElementById('dzStage');
        if (stage) stage.style.background = stageBgCSS();
      });
    })(picks[j]);
  }
  /* ⭐ 背景图上传 */
  var bacts = box.querySelectorAll('[data-bgact]');
  for (var n=0;n<bacts.length;n++){
    (function(b){
      b.addEventListener('click', function(){
        var a = b.getAttribute('data-bgact');
        if (a === 'upload'){
          window.pickImage(function(dataUrl){
            DZ.bg.type = 'image';
            DZ.bg.url = dataUrl;
            renderDesign();
            toast('📤 背景图已设置');
          });
        } else {
          DZ.bg.url = '';
          renderDesign();
          toast('已清除背景图');
        }
      });
    })(bacts[n]);
  }
}

/* ---------------- 图层面板 ---------------- */
function renderLayerList(){
  var box = document.getElementById('dzPaneLayers');
  if (!box) return;
  if (!DZ.els.length){
    box.innerHTML = '<div class="di-empty">还没有元素<br>点击左侧组件添加</div>';
    return;
  }
  var html = '';
  for (var i = DZ.els.length - 1; i >= 0; i--){
    var el = DZ.els[i];
    var label = el.text ? String(el.text).slice(0, 10) : EL_TYPES[el.type].name;
    html += '<div class="di-layer' + (DZ.sel === el.id ? ' sel' : '') + '" data-lid="' + el.id + '">'
      + '<span class="li-ic">' + EL_TYPES[el.type].icon + '</span>'
      + '<span class="li-name">' + esc(label) + '</span>'
      + '<span class="li-acts">'
      + '<button data-la="up" title="上移一层">▲</button>'
      + '<button data-la="dn" title="下移一层">▼</button>'
      + '<button data-la="del" class="dl-del" title="删除">✕</button>'
      + '</span></div>';
  }
  box.innerHTML = html;

  var items = box.querySelectorAll('.di-layer');
  for (var k=0;k<items.length;k++){
    (function(it){
      var id = it.getAttribute('data-lid');
      it.addEventListener('click', function(e){
        if (e.target.tagName === 'BUTTON') return;
        selectEl(id);
      });
      var btns = it.querySelectorAll('button');
      for (var q=0;q<btns.length;q++){
        (function(b){
          b.addEventListener('click', function(e){
            e.stopPropagation();
            var el = findEl(id);
            if (!el) return;
            var a = b.getAttribute('data-la');
            if (a === 'del') removeEl(id);
            else if (a === 'up') raiseEl(el);
            else if (a === 'dn') lowerEl(el);
          });
        })(btns[q]);
      }
    })(items[k]);
  }
}

/* ---------------- 元素操作 ---------------- */
function removeEl(id){
  DZ.els = DZ.els.filter(function(x){ return x.id !== id; });
  if (DZ.sel === id) DZ.sel = null;
  renderDesign();
  toast('🗑 已删除');
}
function duplicateEl(el){
  var c = JSON.parse(JSON.stringify(el));
  c.id = 'e' + (DZ.nextId++);
  c.x += 22; c.y += 22;
  DZ.els.push(c);
  DZ.sel = c.id;
  renderDesign();
  toast('📋 已复制');
}
function moveToEnd(el){
  var i = DZ.els.indexOf(el);
  if (i < 0) return;
  DZ.els.splice(i, 1);
  DZ.els.push(el);
  renderDesign();
}
function moveToStart(el){
  var i = DZ.els.indexOf(el);
  if (i < 0) return;
  DZ.els.splice(i, 1);
  DZ.els.unshift(el);
  renderDesign();
}
function raiseEl(el){
  var i = DZ.els.indexOf(el);
  if (i < 0 || i >= DZ.els.length - 1) return;
  DZ.els[i] = DZ.els[i+1];
  DZ.els[i+1] = el;
  renderDesign();
}
function lowerEl(el){
  var i = DZ.els.indexOf(el);
  if (i <= 0) return;
  DZ.els[i] = DZ.els[i-1];
  DZ.els[i-1] = el;
  renderDesign();
}

/* ---------------- 导出代码 ---------------- */
function elStyleText(el){
  var s = [];
  s.push('  position: absolute;');
  s.push('  left: ' + el.x + 'px;');
  s.push('  top: ' + el.y + 'px;');
  s.push('  width: ' + el.w + 'px;');
  s.push('  height: ' + el.h + 'px;');
  var isImg = (el.type === 'image' && el.src);
  if (isImg){
    s.push('  display: block;');
    s.push('  object-fit: ' + (el.fit || 'cover') + ';');
  } else {
    s.push('  display: flex;');
    s.push('  align-items: center;');
    s.push('  justify-content: ' + (el.align === 'left' ? 'flex-start' : (el.align === 'right' ? 'flex-end' : 'center')) + ';');
    if (el.type !== 'divider') s.push('  padding: 0 10px;');
  }
  s.push('  box-sizing: border-box;');
  s.push('  overflow: hidden;');
  if (el.bg && el.bg !== 'transparent') s.push('  background: ' + el.bg + ';');
  if (el.radius) s.push('  border-radius: ' + el.radius + 'px;');
  if (el.opacity !== undefined && el.opacity < 100) s.push('  opacity: ' + (el.opacity / 100) + ';');
  if (el.shadow) s.push('  box-shadow: 0 10px 30px rgba(0,0,0,.18);');
  if (el.blur){
    s.push('  backdrop-filter: blur(' + el.blur + 'px);');
    s.push('  -webkit-backdrop-filter: blur(' + el.blur + 'px);');
  }
  if (el.borderW) s.push('  border: ' + el.borderW + 'px solid ' + (el.borderColor || '#ffffff') + ';');
  if (el.color) s.push('  color: ' + el.color + ';');
  if (el.fontSize) s.push('  font-size: ' + el.fontSize + 'px;');
  if (el.fontWeight) s.push('  font-weight: ' + el.fontWeight + ';');
  if (el.type === 'text' || el.type === 'link') s.push('  line-height: 1.35;');
  if (el.type === 'link' && el.underline !== 0) s.push('  text-decoration: underline;');
  if (el.type === 'link' || el.type === 'button') s.push('  text-decoration: none;');
  return s.join('\n');
}

function elMarkup(el, cls){
  var t = esc(el.text || '');
  switch (el.type){
    case 'link':
      return '<a class="' + cls + '" href="' + esc(el.href || '#') + '">' + t + '</a>';
    case 'button':
      return el.href
        ? '<a class="' + cls + '" href="' + esc(el.href) + '">' + t + '</a>'
        : '<button class="' + cls + '" type="button">' + t + '</button>';
    case 'input':
      return '<input class="' + cls + '" type="text" placeholder="' + esc(el.placeholder || '') + '">';
    case 'image':
      return el.src
        ? '<img class="' + cls + '" src="' + esc(el.src) + '" alt="">'
        : '<div class="' + cls + '"><span style="font-size:28px;opacity:.6">🖼️</span></div>';
    case 'divider':
      return '<div class="' + cls + '"></div>';
    default:
      return '<div class="' + cls + '">' + t + '</div>';
  }
}

function exportCode(){
  var cssLines = [], htmlLines = [];
  DZ.els.forEach(function(el, i){
    var cls = 'el-' + (i + 1);
    cssLines.push('.' + cls + ' {\n' + elStyleText(el) + '\n}');
    htmlLines.push('  ' + elMarkup(el, cls));
  });

  var pageBg = stageBgCSS();
  var bodyBg = DZ.bg.type === 'image' && DZ.bg.url
    ? 'url("' + DZ.bg.url + '") center/cover no-repeat'
    : 'linear-gradient(135deg, ' + DZ.bg.a + ' 0%, ' + DZ.bg.b + ' 100%)';

  var code =
'<!DOCTYPE html>\n' +
'<html lang="zh-CN">\n' +
'<head>\n' +
'<meta charset="UTF-8">\n' +
'<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
'<title>我的页面</title>\n' +
'<style>\n' +
'* { margin: 0; padding: 0; box-sizing: border-box; }\n' +
'body {\n' +
'  min-height: 100vh;\n' +
'  display: flex;\n' +
'  align-items: center;\n' +
'  justify-content: center;\n' +
'  background: ' + bodyBg + ';\n' +
'  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;\n' +
'}\n' +
'.page {\n' +
'  position: relative;\n' +
'  width: ' + DZ.cw + 'px;\n' +
'  height: ' + DZ.ch + 'px;\n' +
'  background: ' + pageBg + ';\n' +
'  overflow: hidden;\n' +
'  box-shadow: 0 20px 60px rgba(0,0,0,.25);\n' +
'}\n' +
cssLines.join('\n') + '\n' +
'</style>\n' +
'</head>\n' +
'<body>\n' +
'<div class="page">\n' +
htmlLines.join('\n') + '\n' +
'</div>\n' +
'</body>\n' +
'</html>\n';

  return code;
}

/* ---------------- 构建 UI ---------------- */
function buildUI(){
  DZ.built = true;
  var shell = document.createElement('div');
  shell.className = 'mo';
  shell.id = 'moDesigner';

  var palHTML = '';
  Object.keys(EL_TYPES).forEach(function(t){
    palHTML += '<div class="dz-item" data-type="' + t + '"><span class="ic">' + EL_TYPES[t].icon + '</span>' + EL_TYPES[t].name + '</div>';
  });

  var tplHTML = '';
  TEMPLATES.forEach(function(tp, i){
    tplHTML += '<div class="dz-tpl" data-tpl="' + i + '">' + tp.name + '</div>';
  });

  shell.innerHTML =
    '<div class="dz-shell">'
    + '<div class="dz-top">'
    +   '<span class="dz-title">🖌️ 前端页面设计器</span>'
    +   '<div class="dz-top-actions">'
    +     '<button class="dzb dzb-t" id="dzUploadTop">📤 上传图片</button>'
    +     '<button class="dzb dzb-b" id="dzDownloadTop">💾 下载 HTML</button>'
    +     '<button class="dzb dzb-g" id="dzExport">📋 查看代码</button>'
    +     '<button class="dzb dzb-p" id="dzPreview">👁 预览</button>'
    +     '<button class="dzb dzb-s" id="dzClearAll">🧹 清空</button>'
    +     '<button class="dzb dzb-x" id="dzClose">✕</button>'
    +   '</div>'
    + '</div>'
    + '<div class="dz-body">'
    +   '<div class="dz-left">'
    +     '<div class="dz-panel-title">组件</div>'
    +     '<div class="dz-palette" id="dzPalette">' + palHTML + '</div>'
    +     '<div class="dz-panel-title">预设模板</div>'
    +     '<div class="dz-templates" id="dzTemplates">' + tplHTML + '</div>'
    +   '</div>'
    +   '<div class="dz-center">'
    +     '<div class="dz-canvas-bar">'
    +       '<span id="dzInfo">0 个元素</span>'
    +       '<span class="dz-hint">拖动移动 · 右下角缩放 · 双击改文字 · Delete 删除</span>'
    +     '</div>'
    +     '<div class="dz-wrap" id="dzWrap">'
    +       '<div class="dz-holder" id="dzHolder">'
    +         '<div class="dz-stage" id="dzStage"></div>'
    +       '</div>'
    +     '</div>'
    +   '</div>'
    +   '<div class="dz-right">'
    +     '<div class="dz-tabs">'
    +       '<button class="dz-tab active" data-tab="props">属性</button>'
    +       '<button class="dz-tab" data-tab="layers">图层</button>'
    +     '</div>'
    +     '<div class="dz-tabpane" id="dzPaneProps"></div>'
    +     '<div class="dz-tabpane" id="dzPaneLayers" style="display:none"></div>'
    +   '</div>'
    + '</div>'

      updateInspector();
      toast('📤 图片已插入');
    });
  });

  /* ⭐ 顶部下载 HTML */
  shell.querySelector('#dzDownloadTop').addEventListener('click', function(){
    if (!DZ.els.length){ toast('⚠️ 画布是空的'); return; }
    var code = exportCode();
    if (window.downloadFile('index.html', code, 'text/html;charset=utf-8')){
      toast('💾 已下载 index.html');
    }
  });

  shell.querySelector('#dzExport').addEventListener('click', function(){
    if (!DZ.els.length){ toast('⚠️ 画布是空的'); return; }
    showExport(exportCode());
  });

  shell.querySelector('#dzPreview').addEventListener('click', function(){
    if (!DZ.els.length){ toast('⚠️ 画布是空的'); return; }
    var w = window.open('', '_blank');
    if (!w){ toast('⚠️ 浏览器拦截了弹窗'); return; }
    w.document.write(exportCode());
    w.document.close();
  });

  shell.querySelector('#dzClearAll').addEventListener('click', function(){
    if (!DZ.els.length){ toast('📭 画布已经是空的'); return; }
    if (!confirm('确定清空画布上的全部元素？')) return;
    DZ.els = []; DZ.sel = null; DZ.nextId = 1;
    renderDesign();
    toast('🧹 画布已清空');
  });

  /* 点击空白取消选中 */
  shell.querySelector('#dzStage').addEventListener('pointerdown', function(e){
    if (e.target === this){
      DZ.sel = null;
      renderDesign();
    }
  });

  /* 键盘 */
  document.addEventListener('keydown', onKeyDown);

  window.addEventListener('resize', function(){
    if (shell.classList.contains('show')) fitCanvas();
  });
}

function onKeyDown(e){
  var mo = document.getElementById('moDesigner');
  if (!mo || !mo.classList.contains('show')) return;
  var tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable) return;

  var el = DZ.sel ? findEl(DZ.sel) : null;

  if (e.key === 'Escape'){
    if (DZ.sel){ DZ.sel = null; renderDesign(); }
    return;
  }
  if (!el) return;

  var step = e.shiftKey ? 10 : 1;
  if (e.key === 'Delete' || e.key === 'Backspace'){
    e.preventDefault();
    removeEl(el.id);
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')){
    e.preventDefault();
    duplicateEl(el);
    return;
  }
  if (e.key === 'ArrowUp'){ e.preventDefault(); el.y -= step; }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); el.y += step; }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); el.x -= step; }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); el.x += step; }
  else return;

  refreshEl(el);
  updateInspector();
}

/* ---------------- 打开设计器 ---------------- */
function openDesigner(){
  if (!DZ.built) buildUI();
  var shell = document.getElementById('moDesigner');
  shell.classList.add('show');
  setTimeout(function(){
    fitCanvas();
    renderDesign();
  }, 60);
}

/* ---------------- 挂载按钮 ---------------- */
function mount(){
  var btn = document.getElementById('bDesigner');
  if (btn) btn.onclick = openDesigner;
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
else mount();

/* 暴露到全局 */
window.openDesigner = openDesigner;

})();
